name: thermalprint
base: core24
adopt-info: thermalprint
summary: Design, prepare, and print thermal labels
license: MIT
grade: stable
confinement: strict
icon: data/org.thermalprint.ThermalPrint.png
website: https://github.com/arios4k/thermalprint
source-code: https://github.com/arios4k/thermalprint
issues: https://github.com/arios4k/thermalprint/issues
description: |
  ThermalPrint is a local workspace for designing, preparing, and printing labels on thermal label printers, with a native Linux desktop interface.

  Design
  - Start from a template or a blank label, then add text, addresses, logos, shapes, real barcodes, and QR codes.
  - Position objects precisely with a custom grid, smart guides, arrow-key nudging, and align, distribute, flip, and lock tools. Rotate freely, including fractional angles.
  - Wrap or shrink text to fit its box, use your own fonts, dither photos for thermal printing, and see the printer's unprintable border.
  - Make GS1-128 and GS1 Data Matrix barcodes with an SSCC helper, and fill QR codes from website, Wi-Fi, contact, email, and phone forms.
  - Add shipping symbols, saved logos, and addresses from an address book; browse templates in a gallery with previews.
  - Save reusable designs as editable .thermalprint files, and your own templates. Unsaved changes are recovered after an unexpected exit.

  Prepare existing labels
  - Import PDF and image labels (PNG, JPEG, TIFF, BMP, WebP) from carriers and marketplaces such as Vinted, eBay, Etsy, Shopify, USPS, UPS, and FedEx.
  - Crop instructions and whitespace, review the result, and arrange several labels in a print queue. No account connection is needed.

  Print or export
  - Start at 4 x 6 inches, choose another preset, or enter custom dimensions.
  - Print through CUPS with media size matching, resolution (DPI) options, copies, and job status.
  - Print a numbered range, place several labels on an A4 or Letter sheet, or merge a spreadsheet into a design. Labels for continuous rolls can size themselves to their content.
  - Export a dimensioned PDF or PNG, an SVG design, or raster ZPL for a ZPL-compatible raw queue.

  Comfort
  - Light, dark, and system themes, keyboard shortcuts, and a searchable guide that explains CUPS, DPI, document formats, and barcode terms.

  Privacy and permissions
  - Documents are processed on your computer; nothing is uploaded.
  - The Snap uses strict confinement. It requests only printing (cups interface), your home folder, and network access (for opening help links). It does not request printer administration or direct USB access.
  - Removable-media access is optional (see the optional steps below).

  After installing
  - Add your label printer in your system's printer settings. ThermalPrint prints to existing CUPS queues; it does not install drivers.
  - Printing is connected automatically. If it ever is not, ThermalPrint shows the exact command to run.

  Optional steps (a Snap cannot do these for you)
  - Save labels to USB drives or other removable storage:
  sudo snap connect thermalprint:removable-media
  - Open saved .thermalprint files by double-click. Run this once from your normal terminal (not snap run):
  /snap/thermalprint/current/usr/share/doc/thermalprint/register-mime.sh

  Source code, status, and issue tracker: see the project page.

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

assumes: [snapd2.55]

# Canonical's cups-interface bootstrap: install the CUPS provider without
# requesting the privileged cups-control interface.
# https://snapcraft.io/docs/reference/interfaces/cups-interface/
plugs:
  cups-install:
    interface: content
    content: foo
    default-provider: cups
    target: $SNAP_DATA/foo

apps:
  thermalprint:
    command: bin/thermalprint-launch
    desktop: usr/share/applications/org.thermalprint.ThermalPrint.desktop
    extensions: [gnome]
    plugs:
      - cups
      - home
      - network
      - removable-media

parts:
  thermalprint:
    plugin: rust
    source: .
    rust-channel: stable
    rust-cargo-parameters: [--bin, thermalprint]
    # The egui app needs GNOME at runtime, not its build-time libc override.
    # Otherwise a newer rustup snap can load the SDK's incompatible libc.
    build-environment:
      - LD_LIBRARY_PATH: ''
    build-packages:
      - pkg-config
      - libssl-dev
      - python3
      - shared-mime-info
      - desktop-file-utils
    stage-packages:
      - cups-client
      - poppler-utils
    override-pull: |
      craftctl default
      craftctl set version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
    override-build: |
      craftctl default
      cargo test --release --locked
      install -Dm755 snap/local/thermalprint-launch "$CRAFT_PART_INSTALL/bin/thermalprint-launch"
      install -Dm644 data/org.thermalprint.ThermalPrint.desktop "$CRAFT_PART_INSTALL/usr/share/applications/org.thermalprint.ThermalPrint.desktop"
      desktop-file-validate "$CRAFT_PART_INSTALL/usr/share/applications/org.thermalprint.ThermalPrint.desktop"
      sed -i 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.png|; /^StartupWMClass=/d' "$CRAFT_PART_INSTALL/usr/share/applications/org.thermalprint.ThermalPrint.desktop"
      install -Dm644 data/org.thermalprint.ThermalPrint.metainfo.xml "$CRAFT_PART_INSTALL/usr/share/metainfo/org.thermalprint.ThermalPrint.metainfo.xml"
      install -Dm644 data/org.thermalprint.ThermalPrint.xml "$CRAFT_PART_INSTALL/usr/share/mime/packages/org.thermalprint.ThermalPrint.xml"
      update-mime-database "$CRAFT_PART_INSTALL/usr/share/mime"
      install -Dm644 README.md "$CRAFT_PART_INSTALL/usr/share/doc/thermalprint/README.md"
      install -Dm644 docs/SNAP.md "$CRAFT_PART_INSTALL/usr/share/doc/thermalprint/SNAP.md"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/usr/share/licenses/thermalprint/LICENSE"
      install -Dm644 assets/fonts/LICENSE.txt "$CRAFT_PART_INSTALL/usr/share/licenses/thermalprint/FONT-LICENSE.txt"
      install -Dm755 snap/local/register-mime.sh "$CRAFT_PART_INSTALL/usr/share/doc/thermalprint/register-mime.sh"
