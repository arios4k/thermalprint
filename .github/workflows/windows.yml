name: Windows 11
on:
  push:
    branches: [main, windows-port]
    tags: ['v*', 'windows-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      STORE_IDENTITY_NAME: ${{ vars.THERMALPRINT_STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.THERMALPRINT_STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.THERMALPRINT_STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows Store release
        if: startsWith(github.ref, 'refs/tags/windows-v') || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = Select-String -Path Cargo.toml -Pattern '^version = "([0-9]+\.[0-9]+\.[0-9]+)"$' | Select-Object -First 1
          $releasePrefix = if ($env:GITHUB_REF_NAME.StartsWith('windows-v')) { 'windows-v' } else { 'v' }
          if (!$version -or $env:GITHUB_REF_NAME -cne "$releasePrefix$($version.Matches[0].Groups[1].Value)") {
              throw 'The Windows release tag must match the version in Cargo.toml (vMAJOR.MINOR.PATCH or windows-vMAJOR.MINOR.PATCH).'
          }
          foreach ($name in 'STORE_IDENTITY_NAME', 'STORE_PUBLISHER', 'STORE_PUBLISHER_DISPLAY_NAME') {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                  throw "Set the THERMALPRINT_$name repository variable before building a Store update."
              }
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - name: Test with bundled PDFium
        shell: pwsh
        run: |
          ./packaging/windows/get-pdfium.ps1 -Destination target/pdfium
          $env:THERMALPRINT_PDFIUM_DIR = (Resolve-Path target/pdfium/bin).Path
          cargo test --locked --target x86_64-pc-windows-msvc
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package MSIX
        shell: pwsh
        run: |
          $identity = @{}
          if ($env:STORE_IDENTITY_NAME -and $env:STORE_PUBLISHER -and $env:STORE_PUBLISHER_DISPLAY_NAME) {
              $identity = @{
                  IdentityName = $env:STORE_IDENTITY_NAME
                  Publisher = $env:STORE_PUBLISHER
                  PublisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME
              }
              'MSIX_KIND=store' >> $env:GITHUB_ENV
          } else {
              'MSIX_KIND=development' >> $env:GITHUB_ENV
          }
          ./packaging/windows/package.ps1 -Executable target/x86_64-pc-windows-msvc/release/thermalprint.exe -PdfiumDirectory target/pdfium -OutputDirectory target/msix @identity
      - uses: actions/upload-artifact@v4
        with:
          name: ThermalPrint-Windows-x64-${{ env.MSIX_KIND }}
          path: target/msix/*.msix
          if-no-files-found: error

  store:
    # Uploads the Store package from a release tag and submits it for certification.
    # Skipped (with a notice) until the MSSTORE_* secrets are set; see packaging/windows/README.md.
    needs: windows
    if: startsWith(github.ref, 'refs/tags/windows-v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: microsoft-store
    concurrency:
      group: microsoft-store
      cancel-in-progress: false
    env:
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      STORE_SUBMIT_MODE: ${{ vars.THERMALPRINT_STORE_SUBMIT }}
    steps:
      - name: Check Store credentials
        id: credentials
        shell: pwsh
        run: |
          $missing = 'MSSTORE_TENANT_ID', 'MSSTORE_SELLER_ID', 'MSSTORE_CLIENT_ID', 'MSSTORE_CLIENT_SECRET' |
              Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
              "::notice title=Microsoft Store::Not submitted. Set these secrets to publish automatically: $($missing -join ', ')"
              'ready=false' >> $env:GITHUB_OUTPUT
          } else {
              'ready=true' >> $env:GITHUB_OUTPUT
          }
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.ready == 'true'
      - uses: actions/download-artifact@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          name: ThermalPrint-Windows-x64-store
          path: target/msix
      - uses: microsoft/microsoft-store-apppublisher@v1.1
        if: steps.credentials.outputs.ready == 'true'
      - name: Sign in to Partner Center
        if: steps.credentials.outputs.ready == 'true'
        shell: pwsh
        run: msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
      - name: Upload, update listing, and submit
        if: steps.credentials.outputs.ready == 'true'
        shell: pwsh
        run: |
          $msix = Get-ChildItem target/msix -Filter *.msix | Select-Object -First 1
          if (!$msix) { throw 'The Store MSIX artifact is empty.' }
          $options = @{}
          if ($env:STORE_SUBMIT_MODE -eq 'draft') { $options.NoSubmit = $true }
          ./packaging/windows/submit-store.ps1 -Msix $msix.FullName @options
