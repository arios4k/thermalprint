name: Publish APT landing page

on:
  push:
    branches: [main]
    paths:
      - 'docs/apt/**'
      - 'docs/manual/**'
      - 'scripts/build-manual.py'
      - '.github/workflows/apt-page.yml'
  workflow_dispatch:

permissions:
  # actions: write lets scripts/pages-artifact.sh list and remove the run's site artifacts.
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: thermalprint-apt-release
  cancel-in-progress: false

jobs:
  publish:
    # A release commit is published by the release workflow when its tag is pushed. Both
    # workflows would deploy the site for the same commit, and GitHub Pages treats a second
    # deployment of the same commit as already done, so whichever ran second was silently
    # ignored. The landing page ran first with the old package index, and the new version
    # never went live. Release commits are named "Release x.y.z: ...".
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-site
      - name: Update landing page and preserve signed repository
        run: |
          set -eu
          test -s apt-site/dists/stable/InRelease
          test -s apt-site/key.asc
          cp source/docs/apt/index.html apt-site/index.html
          git -C apt-site config user.name 'github-actions[bot]'
          git -C apt-site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C apt-site add index.html
          if ! git -C apt-site diff --cached --quiet; then
            git -C apt-site commit -m "Update ThermalPrint APT landing page"
            git -C apt-site push origin HEAD:gh-pages
          fi
      - uses: actions/configure-pages@v5
      - name: Stage public APT files
        run: |
          mkdir apt-public
          cp -r apt-site/dists apt-site/pool apt-site/key.asc apt-site/index.html apt-site/.nojekyll apt-public/
      - name: Build the user manual into the site
        run: python3 source/scripts/build-manual.py --output apt-public/manual
      - name: Remove site artifacts left by earlier attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh source/scripts/pages-artifact.sh clean
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apt-public
      - name: Wait until GitHub lists the site artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh source/scripts/pages-artifact.sh wait
      # deploy-pages looks the artifact up through a different GitHub service than the wait
      # step above, which can still report none for a moment after the artifact is listed.
      # When the first attempt fails, wait and try once more before failing the job.
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
      - name: Wait before retrying the deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - uses: actions/deploy-pages@v4
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
