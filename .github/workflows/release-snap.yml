name: Release Snap

# Publishes to the Snap Store stable channel automatically for version tags,
# alongside the APT (release-apt.yml) and Fedora/Copr (release-rpm.yml) releases.
# Add required reviewers to the `snap-store` environment to insert an approval gate.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: thermalprint-snap-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      snap-name: ${{ steps.name.outputs.file }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the tag to match the Cargo version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml squashfs-tools shared-mime-info xdg-utils libfile-mimeinfo-perl
      - name: Verify Snap packaging contracts
        run: /usr/bin/python3 -m unittest discover -s scripts -p test_snap_packaging.py
      - uses: canonical/action-build@v1
        id: build
      - name: Inspect built Snap
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: /usr/bin/python3 scripts/verify-snap.py "$SNAP_FILE"
      - id: name
        run: echo "file=$(basename '${{ steps.build.outputs.snap }}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: thermalprint-snap-amd64
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: snap-store
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: thermalprint-snap-amd64
          path: dist
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: dist/${{ needs.build.outputs.snap-name }}
          release: stable
