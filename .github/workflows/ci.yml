name: Rust
on:
  push:
    # Skip the Rust checks when a change touches only the user manual and its builder;
    # the "Manual" workflow still checks those. A change that also touches anything else
    # runs everything.
    paths-ignore:
      - 'docs/manual/**'
      - 'scripts/build-manual.py'
      - 'scripts/test_build_manual.py'
  pull_request:
    paths-ignore:
      - 'docs/manual/**'
      - 'scripts/build-manual.py'
      - 'scripts/test_build_manual.py'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify desktop file associations
        run: |
          sudo apt-get update
          sudo apt-get install -y shared-mime-info desktop-file-utils xdg-utils libfile-mimeinfo-perl
          desktop-file-validate data/org.thermalprint.ThermalPrint.desktop
          python3 -m unittest discover -s scripts -p test_desktop_integration.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
