name: Rust
on:
  push:
    # Skip the Rust checks when a change touches only the user manual and its builder;
    # the "Manual" workflow still checks those. A change that also touches anything else
    # runs everything.
    paths-ignore:
      - 'docs/manual/**'
      - 'scripts/build-manual.py'
      - 'scripts/test_build_manual.py'
  # Pull requests always start this workflow, so "Rust tests" can be a required check;
  # the "changes" job skips the tests when a pull request touches only the manual.
  pull_request:
jobs:
  changes:
    name: Rust changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Does this change need the Rust checks?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo relevant=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD \
            | grep -qvE '^(docs/manual/|scripts/build-manual\.py$|scripts/test_build_manual\.py$)'; then
            echo relevant=true >> "$GITHUB_OUTPUT"
          else
            echo relevant=false >> "$GITHUB_OUTPUT"
          fi
  test:
    name: Rust tests
    needs: changes
    # A skipped job counts as passed for a required check.
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify desktop file associations
        run: |
          sudo apt-get update
          sudo apt-get install -y shared-mime-info desktop-file-utils xdg-utils libfile-mimeinfo-perl
          desktop-file-validate data/org.thermalprint.ThermalPrint.desktop
          python3 -m unittest discover -s scripts -p test_desktop_integration.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
